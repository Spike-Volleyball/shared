syntax = "proto3";

option csharp_namespace = "Shared.Contracts.Grpc";

package userprofile;

service UserProfileService {
  rpc CreateProfile (CreateProfileRequest) returns (CreateProfileResponse);
  rpc GetUserInfo (GetUserInfoRequest) returns (GetUserInfoResponse);
  rpc CheckGuardianAccess (CheckGuardianAccessRequest) returns (CheckGuardianAccessResponse);
  rpc GetGuardiansForMinor (GetGuardiansForMinorRequest) returns (GetGuardiansForMinorResponse);
  // GetGuardiansForMinor for a whole roster in one round trip. A people list seeds guardian links
  // from the ward side for every member it shows, and one call per member was the largest N+1 on
  // production.
  rpc GetGuardiansForMinors (GetGuardiansForMinorsRequest) returns (GetGuardiansForMinorsResponse);
  rpc GetMinorsForGuardian (GetMinorsForGuardianRequest) returns (GetMinorsForGuardianResponse);
  rpc GetAllActiveUserIds (GetAllActiveUserIdsRequest) returns (GetAllActiveUserIdsResponse);
  rpc GetAbsenceWindows (GetAbsenceWindowsRequest) returns (GetAbsenceWindowsResponse);
  rpc GetPlayerPositions (GetPlayerPositionsRequest) returns (GetPlayerPositionsResponse);
  // Which of these users the viewer may see, by the rules a profile is shown by: an adult to any
  // signed-in user, a minor only to themselves, their guardians and the members of their clubs.
  rpc FilterVisibleUsers (FilterVisibleUsersRequest) returns (FilterVisibleUsersResponse);
}

message CreateProfileRequest {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  string first_name = 4;
  string last_name = 5;
}

message CreateProfileResponse {
  bool success = 1;
  string message = 2;
  string profile_id = 3;
}

message GetUserInfoRequest {
  repeated string user_ids = 1;
}

message UserInfo {
  string user_id = 1;
  string email = 2;
  string name = 3;
  string surname = 4;
  string image_url = 5;
}

message GetUserInfoResponse {
  repeated UserInfo users = 1;
}

message CheckGuardianAccessRequest {
  string guardian_id = 1;
  string minor_id = 2;
  bool check_removal_notice = 3;
  repeated string consent_types = 4;
}

message CheckGuardianAccessResponse {
  bool has_access = 1;
  bool is_under_removal_notice = 2;
  int32 permissions = 3;
  repeated string granted_consent_types = 4;

  // GuardianTier as an int. 0 = Guardian, which is what an absent field means and what
  // every link written before this phase is.
  int32 tier = 5;
}

message GetGuardiansForMinorRequest {
  string minor_id = 1;
}

message GetGuardiansForMinorResponse {
  repeated string guardian_ids = 1;
  string minor_display_name = 2;
}

message GetGuardiansForMinorsRequest {
  repeated string minor_ids = 1;
}

message GetGuardiansForMinorsResponse {
  // One entry per distinct, well-formed minor_id in the request, in no particular order. A minor
  // with no guardians is still listed, with empty guardian_ids, so "not a managed minor" and
  // "not asked" cannot be confused.
  repeated MinorGuardians minors = 1;
}

message MinorGuardians {
  string minor_id = 1;
  repeated string guardian_ids = 2;
  string minor_display_name = 3;
}

message GetMinorsForGuardianRequest {
  string guardian_id = 1;
}

message GetMinorsForGuardianResponse {
  repeated MinorInfo minors = 1;
}

message MinorInfo {
  string user_id = 1;
  string display_name = 2;
}

message GetAllActiveUserIdsRequest {
}

message GetAllActiveUserIdsResponse {
  repeated string user_ids = 1;
}

message GetAbsenceWindowsRequest {
  repeated string user_ids = 1;
  string from_date = 2;   // yyyy-MM-dd
  string to_date = 3;     // yyyy-MM-dd
}

message AbsenceWindowProto {
  string user_id = 1;
  string from_date = 2;   // yyyy-MM-dd, inclusive
  string to_date = 3;     // yyyy-MM-dd, INCLUSIVE
  // The absence this window came from. Consumers MUST persist it against anything they decline:
  // the Deleted/Updated events carry only the absence id, so a restore pass has no other way to
  // find the participations a given absence caused.
  string absence_id = 4;
}

message GetAbsenceWindowsResponse {
  repeated AbsenceWindowProto windows = 1;
}

message GetPlayerPositionsRequest {
  repeated string user_ids = 1;
}

message GetPlayerPositionsResponse {
  repeated PlayerPositions players = 1;
}

message PlayerPositions {
  string user_id = 1;
  repeated string positions = 2;  // VolleyballPosition names; preferred + secondary, flattened
}

message FilterVisibleUsersRequest {
  string viewer_id = 1;
  repeated string user_ids = 2;
}

message FilterVisibleUsersResponse {
  // The subset of user_ids the viewer may see, in no particular order.
  repeated string visible_user_ids = 1;
}
