syntax = "proto3";

option csharp_namespace = "Shared.Contracts.Grpc";

package notifications;

service NotificationsInternalService {
  rpc SendPush (SendPushRequest) returns (SendPushResponse);
  rpc SendPushBatch (SendPushBatchRequest) returns (SendPushBatchResponse);
  rpc BroadcastPush (BroadcastPushRequest) returns (BroadcastPushResponse);
}

message SendPushRequest {
  string user_id = 1;
  string title = 2;
  string body = 3;
  map<string, string> data = 4;
  string image_url = 5;
  string group_key = 6;
  bool silent = 7;                   // delivered without sound or vibration ("send without sound")
}

message SendPushResponse {
  bool success = 1;
}

message SendPushBatchRequest {
  repeated SendPushRequest requests = 1;
}

message SendPushBatchResponse {
  int32 total_succeeded = 1;
  int32 total_failed = 2;
}

message BroadcastPushRequest {
  string category = 1;               // NotificationCategory name, e.g. "Announcements"
  string title = 2;                  // <= 200 chars
  string body = 3;                   // <= 500 chars
  map<string, string> data = 4;
  string image_url = 5;
  string group_key = 6;
  repeated string excluded_user_ids = 7;  // chat-muted + author + active-in-chat
}

message BroadcastPushResponse {
  int32 total_recipients = 1;
  int32 total_succeeded = 2;
  int32 total_failed = 3;
}
