syntax = "proto3";

import "google/protobuf/struct.proto";

option csharp_namespace = "Shared.Contracts.Grpc";

package payments;

service PaymentsInternalService {
  rpc CheckActiveSubscription (CheckActiveSubscriptionRequest) returns (CheckActiveSubscriptionResponse);
  rpc GetPaymentStatus (GetPaymentStatusRequest) returns (GetPaymentStatusResponse);
  rpc GetPaymentStatusBatch (GetPaymentStatusBatchRequest) returns (GetPaymentStatusBatchResponse);
  rpc CreateSubscriptionPayment (CreateSubscriptionPaymentRequest) returns (CreateSubscriptionPaymentResponse);
  rpc VoidSubscriptionPayment (VoidSubscriptionPaymentRequest) returns (VoidSubscriptionPaymentResponse);

  // Canonical payment surface (target-based identifiers; backed by the canonical Payment row).
  rpc EnsurePaymentForTarget (EnsurePaymentForTargetRequest) returns (EnsurePaymentForTargetResponse);
  rpc ApplyPaymentStatusChange (ApplyPaymentStatusChangeRequest) returns (ApplyPaymentStatusChangeResponse);
  rpc StartPaymentForTarget (StartPaymentForTargetRequest) returns (StartPaymentForTargetResponse);
  rpc CancelPaymentForTarget (CancelPaymentForTargetRequest) returns (CancelPaymentForTargetResponse);
  rpc SyncPaymentFromProvider (SyncPaymentFromProviderRequest) returns (SyncPaymentFromProviderResponse);
  rpc GetActiveAccount (GetActiveAccountRequest) returns (GetActiveAccountResponse);
  rpc CreateTerminalConnectionToken (CreateTerminalConnectionTokenRequest) returns (CreateTerminalConnectionTokenResponse);
}

// === CheckActiveSubscription ===

message CheckActiveSubscriptionRequest {
  string user_id = 1;
  string club_id = 2;
}

message CheckActiveSubscriptionResponse {
  bool has_active_subscription = 1;
  string subscription_id = 2;       // empty if no active subscription
  string plan_name = 3;             // empty if no active subscription
}

// === GetPaymentStatus ===

message GetPaymentStatusRequest {
  // Provide at least one of these identifiers. PaymentId wins if both are set.
  string payment_id = 1;
  string payment_key = 2;
  // Optionally look up the active payment by target instead:
  string target_type = 3;
  string target_id = 4;
  string payment_method = 5;   // optional scope — matches against Payment.PaymentMethod
}

message GetPaymentStatusResponse {
  bool found = 1;
  string payment_id = 2;
  string payment_key = 3;
  string status = 4;             // Pending | Processing | Completed | Failed | Cancelled | Refunded | Voided
  int64 amount_minor = 5;
  string currency = 6;
  string paid_at = 7;            // ISO 8601, empty string when not completed
  string target_type = 8;
  string target_id = 9;
}

// === GetPaymentStatusBatch ===

message GetPaymentStatusBatchRequest {
  string target_type = 1;
  repeated string target_ids = 2;   // max 500 entries; server returns INVALID_ARGUMENT if exceeded
}

message GetPaymentStatusBatchResponse {
  map<string, PaymentStatusEntry> statuses = 1;   // keyed by target_id
}

message PaymentStatusEntry {
  bool found = 1;
  string payment_id = 2;
  string payment_key = 3;
  string status = 4;
  int64 amount_minor = 5;
  string currency = 6;
  string paid_at = 7;
}

// === CreateSubscriptionPayment ===

message CreateSubscriptionPaymentRequest {
  string user_id = 1;
  string event_id = 2;
  string subscription_id = 3;
  string club_id = 4;
}

message CreateSubscriptionPaymentResponse {
  string payment_id = 1;
  string status = 2;
}

// === VoidSubscriptionPayment ===

message VoidSubscriptionPaymentRequest {
  string user_id = 1;
  string event_id = 2;
}

message VoidSubscriptionPaymentResponse {
  bool success = 1;
  bool already_voided = 2;
}

// === EnsurePaymentForTarget ===
// Idempotently ensure a canonical Payment row exists for (target_type, target_id) with Status=Unpaid.
// Called when a participant becomes payable for a paid event. Safe to call repeatedly.
message EnsurePaymentForTargetRequest {
  string target_type = 1;
  string target_id = 2;
  string payer_user_id = 3;
  string recipient_owner_type = 4;
  string recipient_owner_id = 5;
  int64 amount_minor = 6;
  string currency = 7;
  google.protobuf.Struct metadata = 8;
  string idempotency_key = 9;
}

message EnsurePaymentForTargetResponse {
  string payment_id = 1;
  string status = 2;            // canonical PaymentStatus name (Unpaid|Pending|Paid|...)
  int64 status_version = 3;
  bool created = 4;             // true if a new Payment row was created
}

// === ApplyPaymentStatusChange ===
// Single canonical write surface. Validates the transition, updates Payment.Status,
// increments StatusVersion, writes audit, and publishes PaymentStatusChangedEvent via outbox.
message ApplyPaymentStatusChangeRequest {
  string target_type = 1;
  string target_id = 2;
  string new_status = 3;        // canonical PaymentStatus name
  string payment_method = 4;    // canonical PaymentMethodType name
  string provider = 5;          // canonical PaymentProviderType name
  string actor_user_id = 6;     // empty for system-driven transitions (e.g. Stripe webhook)
  string reason = 7;
  google.protobuf.Struct metadata = 8;
  string idempotency_key = 9;
  int64 expected_version = 10;  // 0 = skip optimistic check
}

message ApplyPaymentStatusChangeResponse {
  string payment_id = 1;
  string old_status = 2;
  string new_status = 3;
  int64 status_version = 4;
  bool no_op = 5;               // true if status was already at new_status (idempotent replay)
}

// === StartPaymentForTarget ===
// Begin a payment attempt (Stripe checkout, etc.). Ensures Payment exists, transitions to
// Pending if needed, creates a PaymentAttempt row, returns provider-specific client_secret.
message StartPaymentForTargetRequest {
  string target_type = 1;
  string target_id = 2;
  string payer_user_id = 3;
  string recipient_owner_type = 4;
  string recipient_owner_id = 5;
  int64 amount_minor = 6;
  string currency = 7;
  string provider = 8;          // canonical PaymentProviderType name
  string payment_method = 9;    // canonical PaymentMethodType name
  google.protobuf.Struct metadata = 10;
  string idempotency_key = 11;
}

message StartPaymentForTargetResponse {
  string payment_id = 1;
  string attempt_id = 2;
  string client_secret = 3;     // empty for non-Stripe providers
  string status = 4;            // canonical PaymentStatus name (typically Pending)
}

// === CancelPaymentForTarget ===
// Cancel an in-flight payment for a target. If a Stripe PaymentIntent is active,
// the server cancels it via the provider; on success the canonical status drops
// back to Unpaid via ApplyPaymentStatusChange (which emits PaymentStatusChangedEvent).
// Returns CANNOT_CANCEL_IN_FLIGHT when the provider reports the intent is mid-charge.
message CancelPaymentForTargetRequest {
  string target_type = 1;
  string target_id = 2;
  string reason = 3;
}

message CancelPaymentForTargetResponse {
  enum Result { CANCELLED = 0; CANNOT_CANCEL_IN_FLIGHT = 1; ALREADY_COMPLETED = 2; NOT_FOUND = 3; }
  Result result = 1;
}

// === SyncPaymentFromProvider ===
// Reconcile a single Payment row against the upstream provider (Stripe). When the
// provider reports a different terminal state than our DB (e.g. webhook missed),
// applies the canonical status change and returns the resulting status. No-op for
// providers without a remote payment intent.
message SyncPaymentFromProviderRequest {
  string payment_id = 1;
}

message SyncPaymentFromProviderResponse {
  string payment_id = 1;
  string status = 2;        // canonical PaymentStatus name after reconcile (Unpaid|Pending|Paid|Failed|Refunded|...)
}

// === GetActiveAccount ===
// Returns the recipient account state for an owner, used by events-service to validate
// recipients at event create/update time. Always live with respect to provider state.
message GetActiveAccountRequest {
  string owner_type = 1;   // "User" | "Club"
  string owner_id   = 2;
}

message GetActiveAccountResponse {
  bool   found               = 1;   // false = no non-deleted UserPaymentAccount row exists
  bool   active              = 2;   // provider says recipient can receive payments now
  string provider            = 3;
  string display_label       = 4;
  bool   onboarding_complete = 5;
  bool   needs_onboarding    = 6;
  // Account default currency, uppercase ISO-4217 (e.g. "GBP").
  // Empty when unknown (no account, or provider has no default_currency yet).
  string currency            = 7;
}

// === CreateTerminalConnectionToken ===
// A short-lived secret letting the Stripe Terminal SDK on an organiser's phone act as a
// reader for the PLATFORM account. Under destination charges the readers and Locations
// belong to the platform; the club is the merchant through on_behalf_of on the intent.
message CreateTerminalConnectionTokenRequest {
  // The venue the session is at, so the reader binds to a Location that says where the
  // money is actually being taken. Sent by events-service from the event's own venue —
  // never by a client, which would be choosing its own acceptance rules.
  //
  // Omit all of it for an event with no club venue: the platform falls back to its
  // configured business address.
  string venue_id = 1;
  TerminalLocationAddress venue_address = 2;
}

// Stripe's required address fields vary by country: GB wants line1/city/postal_code/country,
// while the US, Italy and Spain also require region. Everything is carried so the country
// rules can be honoured server-side rather than guessed at the call site.
message TerminalLocationAddress {
  string display_name = 1;
  string line1 = 2;
  string city = 3;
  string region = 4;
  string country = 5;
  string postal_code = 6;
}

message CreateTerminalConnectionTokenResponse {
  string secret = 1;
  // The Location the caller must bind the reader to. Returned rather than scoped into
  // the token: a Tap to Pay reader is bound at connectReader() time, and scoping a
  // ConnectionToken has no effect for mobile readers.
  string location_id = 2;
}
