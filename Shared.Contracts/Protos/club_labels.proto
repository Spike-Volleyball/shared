syntax = "proto3";

option csharp_namespace = "Shared.Contracts.Grpc";

package clubs;

// Display names for a club's own teams, groups, venues and courts, for another service that shows
// its data to people who may not be able to read the club: a shared planner view is opened by
// anyone its planner chose, while a private club hides its teams and venues from non-members.
// Names and colours only — no rosters, no addresses, no contact details. The club's skill ladder
// and time zone travel with them, so its sessions can say which levels they are for and when, and
// so does its rule for declining, so its events can ask for the note it wants.
service ClubLabels {
  rpc GetClubLabels (GetClubLabelsRequest) returns (GetClubLabelsResponse);
}

message GetClubLabelsRequest {
  string club_id = 1;
}

message GetClubLabelsResponse {
  // False when no such club exists; every other field is then empty.
  bool found = 1;
  UnitLabel club = 2;
  repeated UnitLabel teams = 3;
  repeated UnitLabel groups = 4;
  repeated VenueLabel venues = 5;
  // The club's own skill ladder, lowest rung first. A level means something only inside its club.
  repeated SkillLevelLabel skill_levels = 6;
  // IANA id of the zone the club's sessions are in, e.g. "Europe/London".
  string time_zone = 7;
  // True when a member declining one of the club's events must say why.
  bool require_decline_reason = 8;
  // The club's own words for why it asks, shown beside the note. Empty when it gave none.
  string decline_reason_message = 9;
}

message UnitLabel {
  string id = 1;
  string name = 2;
  // Empty when none is set.
  string color = 3;
  // Clubs only; empty for teams and groups and when none is set.
  string logo_url = 4;
  // Teams and groups only: the levels of the ladder the unit is aimed at. Empty when it is open to
  // every level, and always for clubs.
  repeated string skill_level_ids = 5;
}

message SkillLevelLabel {
  string id = 1;
  string name = 2;
  // Empty when none is set.
  string color = 3;
}

message VenueLabel {
  string id = 1;
  string name = 2;
  repeated CourtLabel courts = 3;
}

message CourtLabel {
  string id = 1;
  string name = 2;
}
